<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; frame-src *; child-src *"
    />
    <title>Браузер — Clauden</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #191919; color: #ececec; font: 13px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #202020; border-bottom: 1px solid #303030; }
      button { width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #cfcfcf; cursor: pointer; font-size: 17px; }
      button:hover { background: #303030; }
      button:disabled { opacity: .35; cursor: default; }
      .url { flex: 1; min-width: 0; height: 32px; border: 1px solid #3a3a3a; border-radius: 8px; background: #161616; color: #ececec; padding: 0 12px; font: 12.5px/1 ui-monospace, monospace; outline: none; }
      .url:focus { border-color: #d97757; }
      .status { width: 8px; height: 8px; border-radius: 50%; background: #3fbf6f; flex: none; }
      .status.loading { background: #d9a441; animation: pulse 1s infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      webview { flex: 1; width: 100%; min-height: 0; }
      .hint { padding: 4px 12px; color: #8d8d8d; font-size: 11px; background: #1b1b1b; border-top: 1px solid #2a2a2a; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="back" title="Назад">‹</button>
      <button id="forward" title="Вперёд">›</button>
      <button id="reload" title="Обновить">⟳</button>
      <input id="url" class="url" spellcheck="false" autocomplete="off" placeholder="Адрес сайта" />
      <span id="status" class="status" title="Готово"></span>
    </div>
    <webview id="view" partition="persist:clauden-browser" allowpopups></webview>
    <div class="hint">Встроенный браузер Clauden. Ссылки из чата открываются здесь; cookie сохраняются между запусками.</div>
    <script>
      const view = document.getElementById("view");
      const url = document.getElementById("url");
      const status = document.getElementById("status");
      const back = document.getElementById("back");
      const forward = document.getElementById("forward");
      const reload = document.getElementById("reload");
      const params = new URLSearchParams(location.search);
      const start = params.get("url") || "https://clauden.best";

      function normalize(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) return text;
        if (/^localhost(:\d+)?(\/|$)/i.test(text) || /^\d{1,3}(\.\d{1,3}){3}(:\d+)?/.test(text)) return `http://${text}`;
        return `https://${text}`;
      }

      function setUrl(value) {
        const next = normalize(value);
        if (!next) return;
        url.value = next;
        view.loadURL(next).catch(() => {});
      }

      back.onclick = () => view.canGoBack() && view.goBack();
      forward.onclick = () => view.canGoForward() && view.goForward();
      reload.onclick = () => view.reload();
      url.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          setUrl(url.value);
          url.blur();
        }
      });
      url.addEventListener("focus", () => url.select());

      view.addEventListener("did-start-loading", () => {
        status.classList.add("loading");
        status.title = "Загрузка…";
      });
      view.addEventListener("did-stop-loading", () => {
        status.classList.remove("loading");
        status.title = "Готово";
        back.disabled = !view.canGoBack();
        forward.disabled = !view.canGoForward();
      });
      view.addEventListener("did-navigate", (event) => {
        url.value = event.url || "";
        document.title = `${view.getTitle?.() || "Браузер"} — Clauden`;
      });
      view.addEventListener("did-navigate-in-page", (event) => {
        if (event.isMainFrame) url.value = event.url || "";
      });
      view.addEventListener("page-title-updated", (event) => {
        document.title = `${event.title || "Браузер"} — Clauden`;
      });
      view.addEventListener("did-fail-load", (event) => {
        if (event.errorCode === -3) return;
        status.classList.remove("loading");
        status.title = event.errorDescription || "Не удалось загрузить";
      });

      document.addEventListener("keydown", (event) => {
        if (event.altKey && event.key === "ArrowLeft") view.goBack();
        if (event.altKey && event.key === "ArrowRight") view.goForward();
        if (event.key === "F5" || (event.ctrlKey && event.key.toLowerCase() === "r")) {
          event.preventDefault();
          view.reload();
        }
        if (event.ctrlKey && event.key.toLowerCase() === "l") {
          event.preventDefault();
          url.focus();
        }
      });

      view.src = normalize(start);
      url.value = view.src;
      setTimeout(() => view.focus(), 100);
    </script>
  </body>
</html>
